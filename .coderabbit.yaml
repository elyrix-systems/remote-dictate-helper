# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  # Keep the existing CodeRabbit commit status available as a required check.
  review_progress: false
  commit_status: true
  fail_commit_status: true
  review_status: true
  high_level_summary_in_walkthrough: true
  poem: false
  auto_review:
    # The maintainer requests review with @coderabbitai review after CI passes.
    enabled: false
    auto_incremental_review: false
    drafts: false
  # Preserve the repository's existing optional test-generation setting.
  finishing_touches:
    unit_tests:
      enabled: false
